[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "onto"
version = "0.1.0"
description = "onto — Domain model editor"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "google-cloud-secret-manager>=2.16.0",
    "openai>=1.60.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.package-dir]
onto = "."

[tool.setuptools.packages.find]
where = ["."]
include = ["server*"]

[tool.pytest.ini_options]
pythonpath = [".."]
testpaths = ["tests"]

