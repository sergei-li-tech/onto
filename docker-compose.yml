services:
  onto:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${ONTO_PORT:-8780}:8790"
    environment:
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_BASE: ${LLM_API_BASE:-}
      ONTO_STATIC_DIR: /app/onto/web/dist
      ONTO_OUTPUT_DIR: /app/onto/output
    restart: unless-stopped
